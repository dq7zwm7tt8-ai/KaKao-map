<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Download KakaoMap</title>

<script>
const ua = navigator.userAgent;

if (/Android/i.test(ua)) {
    window.location.replace("https://play.google.com/store/apps/details?id=net.daum.android.map");
} else if (/iPhone|iPad|iPod/i.test(ua)) {
    window.location.replace("https://apps.apple.com/kr/app/kakaomap-korea-no-1-map/id304608425");
} else {
    window.location.replace("https://map.kakao.com/");
}
</script>
